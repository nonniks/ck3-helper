[package]
name = "ck3h-app"
version = "0.1.0"
description = "CK3 Helper desktop app"
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
name = "ck3h_app"

[build-dependencies]
tauri-build = "2"

[dependencies]
ck3h-core = { path = "../../crates/ck3h-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tauri = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
ts-rs = "12"

[dev-dependencies]
ck3h-core = { path = "../../crates/ck3h-core", features = ["testkit"] }
tempfile = "3"
