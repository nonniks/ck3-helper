[package]
name = "ck3h-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
testkit = ["dep:tempfile"]

[dependencies]
dirs = "6"
jomini = "0.37"
rayon = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tempfile = { version = "3", optional = true }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
