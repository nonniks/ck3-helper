[package]
name = "ck3h-cli"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "ck3h"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
ck3h-core = { path = "../ck3h-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
ck3h-core = { path = "../ck3h-core", features = ["testkit"] }
predicates = "3"
tempfile = "3"
